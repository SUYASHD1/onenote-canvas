<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8d24c7"/>
      <stop offset="100%" stop-color="#5c1286"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Base with Soft Shadow -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#purpleGrad)" filter="url(#shadow)"/>
  
  <!-- Subtle Spatial Grid Texture -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="2">
    <line x1="32" y1="160" x2="480" y2="160"/>
    <line x1="32" y1="256" x2="480" y2="256"/>
    <line x1="32" y1="352" x2="480" y2="352"/>
    <line x1="160" y1="32" x2="160" y2="480"/>
    <line x1="256" y1="32" x2="256" y2="480"/>
    <line x1="352" y1="32" x2="352" y2="480"/>
  </g>

  <!-- Signature OneNote Emblem "N" (Clean Vector with No Pointer) -->
  <g fill="#ffffff">
    <path d="M150 130 H220 L300 290 V130 H362 V382 H292 L212 222 V382 H150 Z"/>
  </g>
</svg>
